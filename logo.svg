<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="title desc">
  <title id="title">Fella</title>
  <desc id="desc">A dimensional teal and blue orb with a soft violet highlight.</desc>
  <defs>
    <radialGradient id="fella-orb-base" cx="24%" cy="18%" r="88%">
      <stop offset="0" stop-color="#efedff" />
      <stop offset=".2" stop-color="#b9a8ed" />
      <stop offset=".47" stop-color="#5977bd" />
      <stop offset=".73" stop-color="#0eb7bf" />
      <stop offset="1" stop-color="#006671" />
    </radialGradient>
    <radialGradient id="fella-orb-light" cx="82%" cy="51%" r="67%">
      <stop offset="0" stop-color="#73f5ef" stop-opacity=".96" />
      <stop offset=".35" stop-color="#008080" stop-opacity=".58" />
      <stop offset="1" stop-color="#008080" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="fella-orb-sheen" cx="18%" cy="12%" r="60%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".82" />
      <stop offset=".3" stop-color="#e4dcff" stop-opacity=".34" />
      <stop offset="1" stop-color="#c9bcf0" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="fella-orb-depth" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#32145f" stop-opacity=".58" />
      <stop offset=".42" stop-color="#174e83" stop-opacity=".13" />
      <stop offset="1" stop-color="#0c223e" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="fella-orb-rim" cx="30%" cy="18%" r="82%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".44" />
      <stop offset=".48" stop-color="#73e9e7" stop-opacity=".2" />
      <stop offset="1" stop-color="#001e2b" stop-opacity=".44" />
    </radialGradient>
  </defs>
  <circle cx="16" cy="16" r="15.15" fill="none" stroke="#3ce0dc" stroke-width="1" opacity=".18" />
  <circle cx="16" cy="16" r="14.35" fill="url(#fella-orb-base)" />
  <circle cx="16" cy="16" r="14.35" fill="url(#fella-orb-light)" />
  <circle cx="16" cy="16" r="14.35" fill="url(#fella-orb-depth)" />
  <circle cx="16" cy="16" r="14.35" fill="url(#fella-orb-sheen)" />
  <circle cx="16" cy="16" r="14.35" fill="none" stroke="url(#fella-orb-rim)" stroke-width=".85" />

# Expected user-visible chart families. A valid task may accept more than one
# visualization when the task intent and underlying values are preserved.
chart_families:
  - bar_and_grouped_bar
  - line_and_area
  - stacked_composition
  - scatter_and_bubble
  - histogram_and_density
  - box_and_quantile
  - heatmap
  - observed_vs_forecast_with_uncertainty

source_types:
  - controlled_synthetic
  - public_dataset
  - consented_user_example
  - mixed

# Workspace exposure must say what the agent actually receives. The legacy
# agent_eval bench runner stages only the files listed for each case.
workspace_scopes:
  - listed_files
  - entire_workspace

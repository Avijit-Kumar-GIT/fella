name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Native build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config file

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Svelte diagnostics
        run: pnpm run check

      - name: Frontend and Rust sidecar build
        run: pnpm run electron:build

      - name: Package Electron app directory
        run: pnpm exec electron-builder --linux --dir --publish never

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: BYOK test surface
        run: bash scripts/check-byok-test-surface.sh

      - name: Electron bridge tests
        run: pnpm run test:electron-bridge

      - name: Electron update tests
        run: pnpm run test:electron-update

      - name: Chart renderer tests
        run: pnpm run test:chart-renderer

      - name: Release artifact validation tests
        run: pnpm run test:release-artifacts

      - name: FQA-Bench adapter and fixture checks
        run: |
          python3 bench/fqa-bench/build_runner_cases.py --suite-dir bench/fqa-bench/suites/uci-bike-sharing --check
          python3 bench/fqa-bench/build_runner_cases.py --suite-dir bench/fqa-bench/suites/clarification-housing --check
          python3 bench/fqa-bench/suites/clarification-housing/validate_suite.py
          python3 bench/fqa-bench/test_report_slices.py

      - name: FQA-Bench runner tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --features eval --example agent_eval --locked

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --features eval --locked -- -D warnings

      # SQLite is the shipped engine; do not enable the optional DuckDB build here.
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  audit:
    # Advisory only until the tree is fully clear. This never masks a failed build/test.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          cache-all-crates: true

      - name: cargo-audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --file src-tauri/Cargo.lock

      - name: pnpm audit
        shell: bash
        run: |
          set +e
          out=$(pnpm audit --prod 2>&1); rc=$?
          echo "$out"
          [ "$rc" -eq 0 ] && exit 0
          if echo "$out" | grep -qiE "TimeoutError|ENOTFOUND|ECONNRESET|EAI_AGAIN|ETIMEDOUT|Will retry|socket hang up|request to .* failed"; then
            echo "::warning::pnpm audit could not reach the npm registry; skipped this run."
            exit 0
          fi
          exit "$rc"

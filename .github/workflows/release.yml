name: Release

# Push a tag like v0.1.0 (or v0.1.0-rc.1 to shake out the workflow first).
# Produces a DRAFT prerelease with per-OS installers; review and publish by hand.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: System libraries (Linux only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev build-essential libssl-dev pkg-config file

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # No signing env for v0.1 builds are unsigned; users get the documented
      # open steps (docs/RELEASE.md "Not in v0.1").
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Fella v__VERSION__"
          releaseBody: "Unsigned early build. Verify your download against SHA256SUMS (attached). See the README for install and open steps."
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}

  # After all three platform builds have attached their installers to the draft
  # release, compute one SHA256SUMS over every asset and attach it. Unsigned
  # builds: this is the only integrity check for v0.1, used by the install
  # scripts and by anyone downloading by hand.
  checksums:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Build and upload SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir sums && cd sums
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*'
          rm -f SHA256SUMS
          sha256sum -b * | sort -k2 > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber

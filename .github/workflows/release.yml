name: Release

# A pushed version tag builds unsigned Electron installers and attaches them to
# a GitHub draft. Maintainers review the artifacts and publish the draft by hand.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Native build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config file libssl-dev xvfb

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - run: pnpm install --frozen-lockfile

      - name: Match tag to package versions
        run: node scripts/check-release-version.mjs "${GITHUB_REF_NAME}"

      - name: Svelte diagnostics
        run: pnpm run check

      - name: Electron frontend and sidecar build
        run: pnpm run electron:build

      - name: Package Electron app directory
        run: pnpm exec electron-builder --linux --dir --publish never

      - name: Smoke-test packaged Linux UI and Rust sidecar
        run: xvfb-run -a pnpm run test:electron:packaged -- dist-electron/linux-unpacked/fella

      - name: Electron update tests
        run: pnpm run test:electron-update

      - name: Electron bridge tests
        run: pnpm run test:electron-bridge

      - name: Chart renderer tests
        run: pnpm run test:chart-renderer

      - name: Release artifact validation tests
        run: pnpm run test:release-artifacts

      - name: Release configuration tests
        run: pnpm run test:release-config

      - name: FQA-Bench adapter and fixture checks
        run: |
          python3 bench/fqa-bench/build_runner_cases.py --suite-dir bench/fqa-bench/suites/uci-bike-sharing --check
          python3 bench/fqa-bench/build_runner_cases.py --suite-dir bench/fqa-bench/suites/clarification-housing --check
          python3 bench/fqa-bench/suites/clarification-housing/validate_suite.py
          python3 bench/fqa-bench/test_report_slices.py

      - name: FQA-Bench runner tests
        run: cargo test --manifest-path backend/Cargo.toml --features eval --example agent_eval --locked

      - name: Rust formatting
        run: cargo fmt --manifest-path backend/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path backend/Cargo.toml --all-targets --features eval --locked -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path backend/Cargo.toml --locked

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: mac
          - platform: ubuntu-22.04
            target: linux
          - platform: windows-latest
            target: win
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Linux build dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config file libssl-dev

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Add universal macOS Rust targets
        if: matrix.target == 'mac'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: backend

      - run: pnpm install --frozen-lockfile

      - name: Build universal macOS app and sidecars
        if: matrix.target == 'mac'
        shell: bash
        run: |
          pnpm build
          cargo build --release --locked --target aarch64-apple-darwin --manifest-path backend/Cargo.toml
          node electron/prepare-engine.mjs --target=aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin --manifest-path backend/Cargo.toml
          node electron/prepare-engine.mjs --target=x86_64-apple-darwin
          pnpm exec electron-builder --mac --universal --publish never

      - name: Build Linux app and sidecar
        if: matrix.target == 'linux'
        run: pnpm electron:build && pnpm exec electron-builder --linux --x64 --publish never

      - name: Build Windows app and sidecar
        if: matrix.target == 'win'
        run: pnpm electron:build && pnpm exec electron-builder --win --x64 --publish never

      - name: Smoke-test packaged Windows UI and Rust sidecar
        if: matrix.target == 'win'
        run: pnpm run test:electron:packaged -- dist-electron/win-unpacked/Fella.exe

      - name: Validate platform installers
        shell: bash
        run: node scripts/check-release-artifacts.mjs "${GITHUB_REF_NAME}" "${{ matrix.target }}" dist-electron

      - name: Preserve platform installers for gated publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fella-release-${{ matrix.target }}
          path: dist-electron/Fella_*
          if-no-files-found: error
          compression-level: 0

  publish-draft:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Collect every platform installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fella-release-*
          path: dist-electron
          merge-multiple: true

      - name: Require the complete release artifact set
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/check-release-artifacts.mjs "$TAG" all dist-electron

      - name: Create checksums and the complete unsigned draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version="${TAG#v}"
          (
            cd dist-electron
            sha256sum -b \
              "Fella_${version}_universal.dmg" \
              "Fella_${version}_universal.zip" \
              "Fella_${version}_x64.exe" \
              "Fella_${version}_x64.msi" \
              "Fella_${version}_x64.AppImage" \
              "Fella_${version}_x64.deb" | sort -k2 > ../SHA256SUMS
          )
          cat SHA256SUMS
          notes="Unsigned Electron installers for Fella ${TAG}. Review each platform package and SHA256SUMS before publishing. macOS may require opening the app from Privacy & Security; Windows may show a SmartScreen warning."
          args=("$TAG" dist-electron/Fella_*.dmg dist-electron/Fella_*.zip dist-electron/Fella_*.exe dist-electron/Fella_*.msi dist-electron/Fella_*.AppImage dist-electron/Fella_*.deb SHA256SUMS --repo "$GITHUB_REPOSITORY" --title "Fella $TAG" --draft --verify-tag --notes "$notes")
          if [[ "$TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
